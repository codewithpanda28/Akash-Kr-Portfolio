<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortFolio - Digital Portfolio</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
        /* === Body & Fonts === */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Courier New', monospace;
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === Loader Container === */
        .loading-container {
            text-align: center;
            position: relative;
        }

        /* === Cyber Logo === */
        .cyber-logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #00ff41;
            animation: glow 2s ease-in-out infinite alternate, glitch 3s infinite;
        }

        /* === Loading Text === */
        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .terminal-cursor {
            display: inline-block;
            background: #00ff41;
            animation: blink 1s infinite;
            width: 10px;
            margin-left: 2px;
        }

        /* === Progress Bar === */
        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(0, 255, 65, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00cc33);
            width: 0%;
            box-shadow: 0 0 10px #00ff41;
        }

        /* === Redirect Message === */
        .redirect-message {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeIn 1s ease-in 3.5s forwards;
        }

        /* === Animations === */
        @keyframes glow {
            from { text-shadow: 0 0 20px #00ff41; }
            to { text-shadow: 0 0 30px #00ff41, 0 0 40px #00ff41; }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px red; }
            20% { text-shadow: -2px -2px cyan; }
            40% { text-shadow: 2px -2px lime; }
            60% { text-shadow: -2px 2px yellow; }
            80% { text-shadow: 2px 2px magenta; }
            100% { text-shadow: 0 0 #00ff41; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="cyber-logo">PORTFOLIO</div>
        <div class="loading-text">Initializing digital portfolio<span class="terminal-cursor"></span></div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="redirect-message">Redirecting to command center...</div>
    </div>

    <script>
        const loadingText = document.querySelector('.loading-text');
        const progressFill = document.querySelector('.progress-fill');
        const messages = [
            'Initializing digital portfolio',
            'Loading cyber modules',
            'Establishing secure connection',
            'Accessing command center'
        ];

        let messageIndex = 0;
        let charIndex = 0;
        let width = 0;

        function typeWriter() {
            if (charIndex < messages[messageIndex].length) {
                loadingText.innerHTML = messages[messageIndex].substring(0, charIndex+1) + '<span class="terminal-cursor"></span>';
                charIndex++;
                setTimeout(typeWriter, 80);
            } else {
                setTimeout(() => {
                    messageIndex++;
                    charIndex = 0;
                    if (messageIndex < messages.length) {
                        typeWriter();
                    }
                }, 500);
            }
        }
        typeWriter();

        // Progress bar animation sync
        const progressInterval = setInterval(() => {
            if (width >= 100) {
                clearInterval(progressInterval);
                // Redirect after progress completes
                setTimeout(() => {
                    window.location.href = 'pages/hero_command_center.html';
                }, 300);
            } else {
                width += 1.5; // Adjust speed if needed
                progressFill.style.width = width + '%';
            }
        }, 50);
    </script>
</body>
</html>
