<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protocol Initialization | Akash Kumar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@900&family=JetBrains+Mono:wght@800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" />
    <style>
        :root {
            --primary: #00FFFF;
            --bg: #030303;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .premium-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }

        .loader-wrap {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .logo-box {
            margin-bottom: 3rem;
            position: relative;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            font-style: italic;
            text-transform: uppercase;
            line-height: 0.8;
            margin-bottom: 0.5rem;
        }

        .logo-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.5em;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.6;
        }

        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transition: width 0.1s linear;
        }

        .status-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.05), transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .loading-dot {
            display: inline-block;
            animation: dot-pulse 1.5s infinite;
        }

        @keyframes dot-pulse {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="premium-grid"></div>
    <div class="noise-overlay"></div>
    <div class="scan-line"></div>

    <div class="loader-wrap">
        <div class="logo-box">
            <h1 class="logo-text">AKASH<span style="color: var(--primary);">.</span>K</h1>
            <div class="logo-sub">Command Center Initialization</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-text">
            System Protocol: <span id="statusMsg">Syncing Neural Core</span><span class="loading-dot">...</span>
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusMsg = document.getElementById('statusMsg');

        const protocols = [
            "Syncing Neural Core",
            "Establishing Secure Uplink",
            "Loading Tactical Assets",
            "Verifying Vault Security",
            "Booting Command UI",
            "Protocol Ready"
        ];

        let width = 0;
        let protocolIndex = 0;

        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        window.location.href = 'pages/hero_command_center.html';
                    }, 500);
                }, 400);
            } else {
                width += (Math.random() * 2) + 0.5;
                if (width > 100) width = 100;
                progressBar.style.width = width + '%';

                // Change protocol text based on progress
                const nextProtocolIndex = Math.floor((width / 100) * protocols.length);
                if (nextProtocolIndex > protocolIndex && nextProtocolIndex < protocols.length) {
                    protocolIndex = nextProtocolIndex;
                    statusMsg.innerText = protocols[protocolIndex];
                }
            }
        }, 50);
    </script>
    <script id="dhws-dataInjector" src="/public/dhws-data-injector.js"></script>
</body>

</html>
